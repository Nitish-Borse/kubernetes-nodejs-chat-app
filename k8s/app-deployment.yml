apiVersion: apps/v1
kind: Deployment

metadata:
  name: chats-dep
  namespace: chat-app
  labels:
    app: chats-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: chats-app

  template:
    metadata:
      labels:
        app: chats-app

    spec:
      containers:
        - name: chatsapp-cont
          image: nitishborse/chatapp-img:v1

          ports:
            - containerPort: 8080

          env:
            - name: MONGO_URL
              value: "mongodb://mongodb-service:27017/whatsapp"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          # Startup probe
          # Gives the application time to start before
          # liveness and readiness probes begin.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          # Liveness probe
          # Checks whether the Node.js application is still running.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness probe
          # Checks whether the application is ready to receive traffic.
          # /ready also checks the MongoDB connection.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

