apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: chatsapp-hpa
  namespace: chat-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chats-dep

  minReplicas: 1
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

